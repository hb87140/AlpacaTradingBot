services:
  - type: web
    name: velocity-trading-bot
    runtime: docker
    healthCheckPath: /health
    # Render free tier: web service with auto-assigned PORT
    # Docker build uses Dockerfile (python:3.13-slim) — bypasses Render's
    # native Python runtime which auto-upgraded to 3.14 and has a deadlock bug.
    envVars:
      - key: ALPACA_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ALPACA_SECRET_KEY
        sync: false          # set manually in Render dashboard
      - key: ALPACA_PAPER
        value: "true"        # change to "false" for live trading
      - key: ALPACA_DATA_FEED
        value: "iex"         # free feed; use "sip" for full tape on paid plan
      - key: FMP_API_KEY
        sync: false          # set manually in Render dashboard (financialmodelingprep.com free tier)
